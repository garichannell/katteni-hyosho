<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f1e4"><title>勝手に表彰委員会</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f1e4;color:#30291d;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}.app{max-width:720px;margin:auto;padding:24px 18px 64px}h1{font-size:29px;margin:0 0 8px}p{line-height:1.8}.lead{color:#675b4a}.panel{background:white;padding:24px;border-radius:18px;box-shadow:0 4px 22px #59451c16;margin-top:22px}.hidden{display:none!important}.eyebrow{font-size:13px;letter-spacing:.09em;color:#987a45}.progress{height:7px;background:#eee6d5;border-radius:10px;overflow:hidden;margin:20px 0}.bar{height:100%;background:#a57f3c;transition:width .2s}.q-title{font-size:21px;margin:16px 0 18px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#faf6ec;border:1px solid #e2d6bd;border-radius:10px;padding:14px 10px;min-height:54px;font-size:15px;color:#493c2a;text-align:left}.choice.selected{background:#f0dfb6;border:2px solid #906c2d}.btn{cursor:pointer;border:0;border-radius:11px;background:#473621;color:white;padding:15px 22px;font-size:16px;font-weight:700}.btn.secondary{background:#eee7d9;color:#403324}.btn:disabled{opacity:.4}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.nav .btn{flex:1}input,textarea{width:100%;border:1px solid #d1c4ae;border-radius:10px;padding:14px;font-size:17px;font-family:inherit}textarea{min-height:110px}small{color:#776d5f}.cert{background:#fffaf0;border:12px double #b89a54;padding:26px 18px;text-align:center;font-family:'Hiragino Mincho ProN','Yu Mincho',serif;color:#43341f}.cert .t{font-size:39px;letter-spacing:.2em;margin:14px 0}.cert .award{font-size:25px;font-weight:bold;margin:14px 0}.cert .recipient{font-size:21px;margin:16px 0}.cert .body{font-size:16px;line-height:2.05;text-align:left;margin:22px auto;max-width:550px}.cert .sign{font-size:17px;font-weight:bold}.stamp{display:inline-block;border:3px solid #a9332c;color:#a9332c;padding:7px;transform:rotate(-7deg);font:700 13px sans-serif;margin:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions .btn{flex:1;min-width:130px}@media(max-width:420px){.options{grid-template-columns:1fr}.app{padding:18px 12px 40px}.panel{padding:18px}.cert{padding:18px 12px;border-width:8px}.cert .t{font-size:32px}.cert .body{font-size:14px}}</style></head><body><main class="app"><div id="home"><p class="eyebrow">架空の表彰団体が勝手に認定</p><h1>🏅 勝手に表彰委員会</h1><p class="lead">誰も褒めてくれないことを、我々が勝手に表彰します。</p><div class="panel"><h2>10問で、世界に一枚の賞状。</h2><p>誰かの「あるある」を大真面目に表彰。できた賞状は画像として保存して送れます。</p><button class="btn" onclick="start()">無料で賞状を作る →</button><p><small>会員登録不要。入力した情報はこのブラウザ内だけで処理され、サーバーに送られません。これは架空の賞状です。</small></p></div></div><section id="quiz" class="panel hidden"><div class="eyebrow" id="stepLabel"></div><div class="progress"><div id="progressBar" class="bar"></div></div><h2 class="q-title" id="question"></h2><div id="answers"></div><div class="nav"><button class="btn secondary" onclick="prev()" id="back">戻る</button><button class="btn" onclick="next()" id="next">次へ</button></div></section><section id="result" class="hidden"><h1>表彰状が完成しました！</h1><p class="lead">内容を確認して、友達に送ってみよう。</p><div id="certificate" class="cert"><div class="eyebrow">勝手に表彰委員会 特別認定</div><div class="t">賞 状</div><div class="award" id="award"></div><div class="recipient" id="recipient"></div><div class="body" id="bodyText"></div><p>令和八年十月十三日</p><div id="assoc"></div><div class="sign" id="chair"></div><span class="stamp">勝手に<br>認定</span><p><small>※架空の表彰団体によるジョーク作品です</small></p></div><div class="actions"><button class="btn" onclick="saveImage()">賞状画像を保存</button><button class="btn secondary" onclick="shareResult()">共有する</button><button class="btn secondary" onclick="restart()">別の賞を作る</button></div><p><small>画像の保存がうまくいかない場合は、iPhoneのスクリーンショットでも送れます。</small></p></section></main><script>
const branches={work:{label:'仕事・職場',actions:['いつも忙しそう','会議で発言が多い','仕事を断れない','電話が長い','仕切りたがる','残業が多い','書類をためる','なぜか頼られる'],habits:['ちょっと忙しい','一旦持ち帰ります','至急でお願いします','あと5分で','先に言ってよ','なんとかします','とりあえず確認','今それどころじゃない'],award:'多忙演出賞',assoc:'雰囲気で乗り切る協会',chair:'手一杯 満'},life:{label:'日常生活',actions:['二度寝が得意','忘れ物が多い','いつもギリギリ','片付けが苦手','買い物が好き','方向音痴','食事へのこだわり','健康に気を遣う'],habits:['あと5分','明日からやる','どこ置いたっけ','まあいっか','つい買っちゃった','お腹すいた','今向かってる','今日は特別'],award:'日常調整功労賞',assoc:'全国なんとか生活協会',chair:'日々野 精一'},drink:{label:'飲み会・食事',actions:['乾杯が好き','すぐ酔う','話が長い','毎回幹事','料理を取り分ける','二次会を断らない','同じ話をする','会計が早い'],habits:['もう一軒だけ','全然酔ってない','昔はさ','とりあえず生','今日は控えめに','次どこ行く？','みんな大丈夫？','最後の一杯'],award:'宴席貢献賞',assoc:'全国円満宴席協会',chair:'飲田 足郎'},social:{label:'友人・人間関係',actions:['返信が遅い','相談に乗る','聞き上手','よく笑う','誘いを断らない','約束を忘れる','人脈が広い','気遣いが細かい'],habits:['今見た','それな','なんとかなる','また今度','聞いて聞いて','大丈夫？','ちょっと相談','絶対行く'],award:'交流継続功労賞',assoc:'日本ゆるやか交友協会',chair:'仲良田 続夫'},love:{label:'恋愛・家族',actions:['心配性','世話焼き','記念日を大切にする','家事にこだわる','甘え上手','よく寝る','マイペース','優しすぎる'],habits:['何食べたい？','大丈夫？','任せて','もう寝る','どっちでもいい','忘れてないよ','ありがとう','あとでね'],award:'家庭円満貢献賞',assoc:'全国気配り生活協会',chair:'思井 遣郎'},hobby:{label:'趣味・推し活',actions:['熱中しすぎる','道具を買いすぎる','遠征が多い','知識が深い','負けず嫌い','記録が好き','布教が得意','休日が忙しい'],habits:['これだけは別','次こそは','絶対おすすめ','もう一個欲しい','今回は本気','ちょっと見て','今しかない','まだまだ'],award:'趣味専念功労賞',assoc:'全国余暇本気協会',chair:'夢中田 一筋'},digital:{label:'スマホ・SNS',actions:['既読だけ早い','投稿が多い','写真を撮りすぎる','スマホが手放せない','情報収集好き','動画を見続ける','返信が独特','ネット通販好き'],habits:['あとで返信する','これ見て','バズってた','保存しとこ','スクショした','ちょっと調べる','おすすめに出た','ポチった'],award:'情報接触功労賞',assoc:'全国画面確認協会',chair:'見過田 画面'},other:{label:'その他・変わり者',actions:['独自ルールが多い','妙に几帳面','発想が独特','何でも挑戦する','こだわりが強い','いつも冷静','マイペース','説明が長い'],habits:['普通でしょ','なんで？','ちょっと違う','これ重要','まあ任せて','気のせい','つまりですね','特にない'],award:'独自路線功労賞',assoc:'日本独自判断協会',chair:'我道 行夫'}};
const questions=['誰を表彰する？','相手との関係は？','どんな人物？','特徴的な行動は？','よく言う言葉・癖は？','ちょっと困ったところは？','本当にすごいところは？','印象に残るエピソードは？','どのくらい笑わせたい？','何のために贈る？']; const staticOptions={1:['友人・親友','同僚','上司・先輩','部下・後輩','家族','恋人・パートナー','趣味仲間','その他'],5:['いつもギリギリ','少し頑固','話が長い','忘れっぽい','何でも買う','寝すぎる','心配しすぎる','よく脱線する','マイペース','特になし'],6:['責任感が強い','思いやりがある','努力家','誠実','明るい','頼りになる','行動力がある','聞き上手','我慢強い','一緒にいると楽しい'],8:['上品にクスッ','程よく面白く','少し大げさに'],9:['誕生日','送別会','お礼','飲み会','何でもない日','サプライズ']};let step=0;const values=Array(10).fill('');const el=id=>document.getElementById(id);const show=id=>{['home','quiz','result'].forEach(k=>el(k).classList.toggle('hidden',k!==id));window.scrollTo({top:0,behavior:'smooth'})};function start(){step=0;show('quiz');render()}function options(){if(step===2)return Object.entries(branches).map(([key,b])=>({v:key,t:b.label}));if(step===3)return branches[values[2]||'work'].actions.map(x=>({v:x,t:x}));if(step===4)return branches[values[2]||'work'].habits.map(x=>({v:x,t:x}));return(staticOptions[step]||[]).map(x=>({v:x,t:x}))}function render(){el('stepLabel').textContent=`質問 ${step+1} / 10`;el('progressBar').style.width=`${(step+1)*10}%`;el('question').textContent=questions[step];el('back').disabled=step===0;el('next').textContent=step===9?'賞状を完成させる':'次へ';const host=el('answers');host.replaceChildren();if(step===0||step===7){const field=document.createElement(step===7?'textarea':'input');field.placeholder=step===0?'例：がりちゃんねる':'例：いつも忙しいと言いながら、昼休みは必ず散歩している（省略可）';field.value=values[step];field.maxLength=step===0?30:180;field.addEventListener('input',()=>{values[step]=field.value;updateNext()});host.append(field)}else{const grid=document.createElement('div');grid.className='options';options().forEach(o=>{const btn=document.createElement('button');btn.type='button';btn.className='choice'+(values[step]===o.v?' selected':'');btn.textContent=o.t;btn.onclick=()=>{const was=values[step];values[step]=o.v;if(step===2&&was!==o.v){values[3]='';values[4]=''}render()};grid.append(btn)});host.append(grid)}updateNext()}function updateNext(){el('next').disabled=step!==7&&!values[step].trim()}function next(){if(step!==7&&!values[step].trim())return;if(step===9){makeAward();show('result')}else{step++;render()}}function prev(){if(step>0){step--;render()}}function restart(){values.fill('');step=0;show('home')}
let generated={};function makeAward(){const b=branches[values[2]],action=values[3],habit=values[4],weak=values[5],strength=values[6],story=values[7].trim();const special=values[2]==='work'&&action==='いつも忙しそう';const title=special?'多忙演出賞':action.includes('二度寝')?'睡眠継続賞':action.includes('返信が遅い')?'返信保留賞':action.includes('道具を買いすぎる')?'購買情熱賞':b.award;let body=`あなたは日々の活動において、「${action}」という独自の姿勢を一貫して示し、「${habit}」の精神とともに周囲に深い印象を残されました。さらに、${weak==='特になし'?'安定した行動を積み重ね':`時に${weak}一面を見せながらも` }、${strength}という優れた資質を発揮されました。`;if(story)body+=`とりわけ「${story.slice(0,55)}」という出来事は特筆に値します。`;body+='よってここにその功績を称え、表彰いたします。';if(values[8]==='上品にクスッ')body=body.replace('周囲に深い印象','周囲に穏やかな印象');if(values[8]==='少し大げさに')body=body.replace('特筆に値します','当協会の歴史に刻まれるべきものです');generated={title,recipient:values[0],body,assoc:b.assoc,chair:b.chair,occasion:values[9]};el('award').textContent=title;el('recipient').textContent=values[0]+' 殿';el('bodyText').textContent=body;el('assoc').textContent=b.assoc;el('chair').textContent='代表理事会長　'+b.chair}async function shareResult(){const text=`${generated.recipient}さんに「${generated.title}」を贈ります。\n勝手に表彰委員会`;try{if(navigator.share)await navigator.share({title:'勝手に表彰委員会',text,url:location.href});else{await navigator.clipboard.writeText(text+'\n'+location.href);alert('共有用の文章をコピーしました')}}catch(e){if(e.name!=='AbortError')alert('共有できませんでした。画面をスクリーンショットしてください')}}function saveImage(){const c=document.createElement('canvas');c.width=1400;c.height=990;const x=c.getContext('2d');x.fillStyle='#fffaf0';x.fillRect(0,0,1400,990);x.strokeStyle='#b89a54';x.lineWidth=15;x.strokeRect(22,22,1356,946);x.lineWidth=3;x.strokeRect(48,48,1304,894);x.textAlign='center';x.fillStyle='#4d3923';x.font='29px serif';x.fillText('勝手に表彰委員会　特別認定',700,125);x.font='bold 72px serif';x.fillText('賞 状',700,240);x.font='bold 48px serif';x.fillText(generated.title,700,330);x.font='bold 34px serif';x.fillText(generated.recipient+' 殿',700,407);x.font='30px serif';wrapText(x,generated.body,700,495,1100,49);x.font='27px serif';x.fillText(generated.assoc,700,840);x.font='bold 31px serif';x.fillText('代表理事会長　'+generated.chair,700,897);x.strokeStyle='#b13d35';x.lineWidth=4;x.strokeRect(1085,825,100,85);x.fillStyle='#b13d35';x.font='bold 22px sans-serif';x.fillText('勝手に',1135,860);x.fillText('認定',1135,888);c.toBlob(blob=>{if(!blob){alert('画像生成に失敗しました');return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='勝手に表彰委員会_賞状.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')}function wrapText(ctx,text,cx,y,maxWidth,lineHeight){let line='',lines=[];for(const ch of text){if(ctx.measureText(line+ch).width>maxWidth){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);const display=lines.slice(0,6);display.forEach((line,i)=>ctx.fillText(line,cx,y+i*lineHeight))}
</script></body></html>
